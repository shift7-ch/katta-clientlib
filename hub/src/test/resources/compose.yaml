# Docker Compose environment for integration tests from https://github.com/shift7-ch/katta-compose.
# Replace the reference after # with a tag to use a release, or the URL with the absolute path to compose.yaml
# in a local checkout. The Keycloak realm and setup files of this project are passed with KEYCLOAK_REALM_FILE
# and SETUP_DIR.
include:
  - https://github.com/shift7-ch/katta-compose.git#main

services:
  # MinIO user with static access credentials for the "MinIO S3 static" storage profile of these tests.
  # katta-compose creates the policies attached here, but no user to attach them to.
  minio_setup_testuser:
    profiles: [ local ]
    image: quay.io/minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio_setup:
        condition: service_completed_successfully
    volumes:
      - ${SETUP_DIR:-./setup}:/setup
    entrypoint: [ "/bin/sh","-c" ]
    command:
      - |
        set -eux
        mc alias set myminio ${MINIO_SCHEME}://minio:${MINIO_PORT} minioadmin minioadmin
        mc admin user add myminio ${MINIO_USER_ACCESS_KEY} ${MINIO_USER_SECRET_KEY}
        mc admin policy attach myminio katta-staticaccessbucketpolicy --user ${MINIO_USER_ACCESS_KEY}
        mc admin policy attach myminio katta-staticcreatebucketpolicy --user ${MINIO_USER_ACCESS_KEY}

  # the last service must not exit for `up --wait` to succeed, so let it wait for the user as well
  wait:
    depends_on:
      minio_setup_testuser:
        condition: service_completed_successfully
