name: Publish Artifacts
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  deploy:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
          show-download-progress: true
      - name: Build with Maven
        run: mvn --batch-mode deploy -DskipTests -DskipITs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-windows:
    # Builds the NuGet package attached as nupkg artifact, requires Windows and .NET
    needs: deploy
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Deploy Windows module with Maven
        # Hub and parent are published by the deploy job
        run: mvn --batch-mode deploy -U -pl windows -DskipTests -DskipITs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deploy, deploy-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
