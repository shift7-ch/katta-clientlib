name: Maven Build

on:
  pull_request:

concurrency:
  group: chipotle
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
      packages: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - name: Inspect disk
        run: |
          df -h
          docker system df
        # local docker builds are what eat disk space; skip pruning/freeing when reusing pre-built images from ghcr.io
        # https://stackoverflow.com/questions/30604846/docker-complains-about-no-space-left-on-device-how-to-clean-up
      - name: Prune docker system
        if: steps.images.outputs.use-prebuilt != 'true'
        run: |
          docker system prune --all --force
      # https://www.dzombak.com/blog/2024/09/freeing-disk-space-on-github-actions-runners/
      - name: Free disk space
        if: steps.images.outputs.use-prebuilt != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
      - name: Inspect disk again
        run: |
          df -h
          docker system df
      - name: Docker network prune
        run: docker network prune --force
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Write env
        env:
          HYBRID_ENV: ${{ secrets.HYBRID_ENV }}
        run: printf '%s' "$HYBRID_ENV" > test/src/test/resources/.chipotle.env
      - name: Build with Maven
        run: mvn --no-transfer-progress --batch-mode verify -U
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Publish Test Report
        if: ${{ always() }}
        uses: ScalableCapital/action-surefire-report@v2
        env:
          NODE_OPTIONS: --max-old-space-size=4096
